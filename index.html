<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard interativo de malha logística com mapa, medição de rotas e análise de CDs.">

    <title>Logistics Network Dashboard</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <!-- App CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════════════════════════════
         MAP
         ══════════════════════════════════════════════════════════════════════ -->
    <div id="map"></div>

    <!-- ══════════════════════════════════════════════════════════════════════
         PANEL TOGGLE (visible when panel is closed)
         ══════════════════════════════════════════════════════════════════════ -->
    <button id="panel-toggle" class="panel-toggle-btn" aria-label="Abrir painel">
        📊
    </button>

    <!-- ══════════════════════════════════════════════════════════════════════
         SIDE PANEL
         ══════════════════════════════════════════════════════════════════════ -->
    <aside id="side-panel" class="side-panel">

        <!-- Panel Header -->
        <div class="panel-header">
            <div class="title">
                <span class="title-icon">📊</span>
                Filtros e Controles
            </div>
            <button id="panel-close" class="panel-close-btn" aria-label="Fechar painel">✕</button>
        </div>

        <!-- CD & Flow Filters -->
        <div class="panel-card">
            <div class="section-title">
                <span class="icon">📊</span>
                Painel de Controle
            </div>

            <!-- CD Selector -->
            <div class="hub-selector">
                <label for="select-cd">
                    <span class="point-badge point-a">CD</span>
                    Centro de Distribuição
                </label>
                <select id="select-cd" class="hub-select">
                    <option value="">Selecione o CD...</option>
                </select>
            </div>

            <!-- Flow Direction Filter -->
            <div class="hub-selector">
                <label>Tipo de Operação</label>
                <div class="direction-filter-container">
                    <label class="checkbox-label">
                        <input type="checkbox" id="check-inbound" checked>
                        <span class="checkbox-custom inbound"></span>
                        Inbound (Entrada / Fornecedores)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="check-outbound" checked>
                        <span class="checkbox-custom outbound"></span>
                        Outbound (Saída / Canteiros)
                    </label>
                </div>
            </div>

            <!-- Partner Selector (Dynamic) -->
            <div class="hub-selector">
                <label for="select-parceiro">
                    <span class="point-badge point-b">Parc</span>
                    Parceiro (Fornecedor/Canteiro)
                </label>
                <select id="select-parceiro" class="hub-select" disabled>
                    <option value="">Selecione o Parceiro...</option>
                </select>
            </div>

            <!-- Action Buttons -->
            <button id="btn-medir" class="btn btn-primary" disabled>
                <span>📐</span> Medir Rota
            </button>

            <div style="margin-top: var(--sp-md);">
                <button id="btn-desativar" class="btn btn-danger">
                    <span>✖</span> Limpar Filtros
                </button>
            </div>

            <!-- Measurement Results -->
            <div id="measurement-results" class="measurement-results">
                <div class="divider"></div>

                <div class="result-status success">
                    <span>✅</span> MEDIÇÃO CONCLUÍDA
                </div>

                <div class="result-route-info">
                    <div id="result-from" class="result-from-to">Origem: <strong>—</strong></div>
                    <div id="result-to" class="result-from-to">Destino: <strong>—</strong></div>
                </div>

                <div class="result-box">
                    <div class="result-title">Resultados da Rota</div>

                    <div class="result-row">
                        <div class="label">
                            <span class="dot cyan"></span>
                            Rota por estrada
                        </div>
                        <div class="value">
                            <span id="result-rota-value">—</span>
                        </div>
                    </div>

                    <div class="result-row">
                        <div class="label">
                            <span class="dot yellow"></span>
                            Linha reta (geodésica)
                        </div>
                        <div class="value">
                            <span id="result-reta-value">—</span>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="result-row">
                        <div class="label">
                            <span class="dot orange"></span>
                            Tempo de viagem
                        </div>
                        <div class="value">
                            <span id="result-tempo-value">—</span>
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <button id="btn-copiar" class="btn btn-secondary">
                        <span>📋</span> Copiar Dados
                    </button>
                    <button id="btn-nova-medicao" class="btn btn-success">
                        <span>🔄</span> Nova Medição
                    </button>
                </div>
            </div>
        </div>

    </aside>

    <!-- ══════════════════════════════════════════════════════════════════════
         COPY TOAST
         ══════════════════════════════════════════════════════════════════════ -->
    <div id="copy-toast" class="copy-toast"></div>

    <!-- ══════════════════════════════════════════════════════════════════════
         SCRIPTS
         ══════════════════════════════════════════════════════════════════════ -->
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- App Scripts -->
    <script src="js/data.js"></script>
    <script src="js/measurement.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
