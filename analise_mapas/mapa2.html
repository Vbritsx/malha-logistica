<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mapa dos CDs e PAs Futuros da Sabesp no Estado de São Paulo.">
    <title>Mapa 2 — CDs Futuro + PAs Futuro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #f5f5f7;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text: #1a1a2e;
            --text-dim: #6b7280;
            --border: rgba(0,0,0,0.08);
            --cyan: #0891b2;
            --orange: #ea580c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        .map-title {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 28px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .map-title h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
        }

        .map-title .subtitle {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .legend {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            font-size: 12px;
            color: var(--text-dim);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .water-drop {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            transition: transform 0.2s ease;
        }

        .water-drop:hover { transform: scale(1.3); }
        .water-drop svg { width: 28px; height: 28px; }

        .leaflet-popup-content-wrapper {
            background: var(--panel-bg) !important;
            border: 1px solid var(--border) !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1) !important;
            color: var(--text) !important;
        }
        .leaflet-popup-content { margin: 0 !important; font-family: 'Inter', sans-serif !important; }
        .leaflet-popup-tip { background: var(--panel-bg) !important; border: 1px solid var(--border) !important; }
        .leaflet-popup-close-button { color: var(--text-dim) !important; }

        .popup-card { padding: 12px 16px; }
        .popup-card .cd-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .popup-card .cd-name.cd-futuro { color: var(--cyan); }
        .popup-card .cd-name.pa-futuro { color: var(--orange); }
        .popup-card .cd-addr {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.4;
        }
        .popup-card .cd-tag {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            color: #fff;
        }
        .popup-card .cd-tag.tag-cd { background: var(--cyan); }
        .popup-card .cd-tag.tag-pa { background: var(--orange); }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="map-title">
        <h1>💧 Rede Futura — CDs + PAs</h1>
        <div class="subtitle">5 Centros de Distribuição + 5 Pontos de Apoio no Estado de São Paulo</div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#0891b2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5" fill="#ffffff"/></svg>
            <span style="color: var(--cyan); font-weight: 600;">CD Futuro</span>
            <span>— Centro de Distribuição</span>
        </div>
        <div style="width: 1px; height: 20px; background: var(--border);"></div>
        <div class="legend-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#ea580c"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5" fill="#ffffff"/></svg>
            <span style="color: var(--orange); font-weight: 600;">PA Futuro</span>
            <span>— Ponto de Apoio</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const CDS_FUTURO = [
            { nome: "Parque Novo Mundo", lat: -23.513687, lng: -46.560627, endereco: "Av. Educador Paulo Freire, 986, São Paulo - SP" },
            { nome: "Hortolândia", lat: -22.849402, lng: -47.203328, endereco: "Av. José Augusto de Araújo, 365, Hortolândia - SP" },
            { nome: "Botucatu", lat: -22.932378, lng: -48.464578, endereco: "Av. José Ítalo Bacchi, S/N, Botucatu - SP" },
            { nome: "Lins", lat: -21.681753, lng: -49.760392, endereco: "Av. José Ariano Rodrigues, 936, Lins - SP" },
            { nome: "São José dos Campos", lat: -23.186778, lng: -45.885454, endereco: "Rua Guilherme Rosa da Silva, 300, SJC - SP" },
        ];

        const PAS_FUTURO = [
            { nome: "Franca", lat: -20.538177, lng: -47.400979, endereco: "Rua Moacir Vieira Coelho, 300, Franca - SP" },
            { nome: "Caraguatatuba", lat: -23.692677, lng: -45.448758, endereco: "Estrada do Rio Claro, 420, Caraguatatuba - SP" },
            { nome: "Santos", lat: -23.984899, lng: -46.294982, endereco: "Av. Gov. Mário Covas Júnior, 1040, Santos - SP" },
            { nome: "Registro", lat: -24.484443, lng: -47.85613, endereco: "Rua Joaquim Marques Alves, 1002, Registro - SP" },
            { nome: "Presidente Prudente", lat: -22.137749, lng: -51.405021, endereco: "Rua Manoel Eugênio, 875, Presidente Prudente - SP" },
        ];

        const dropCyan = `<svg viewBox="0 0 24 24" fill="#0891b2" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5" fill="#ffffff"/></svg>`;
        const dropOrange = `<svg viewBox="0 0 24 24" fill="#ea580c" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5" fill="#ffffff"/></svg>`;

        const map = L.map("map", { center: [-22.5, -48.5], zoom: 7, zoomControl: true });

        // Esri Light Gray tiles (claro, sem API key)
        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
            attribution: '&copy; <a href="https://www.esri.com">Esri</a>',
            maxZoom: 16,
        }).addTo(map);

        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
            maxZoom: 16, opacity: 0.7, pane: "overlayPane",
        }).addTo(map);

        // Plot CDs Futuro (Ciano)
        CDS_FUTURO.forEach((cd, i) => {
            const marker = L.marker([cd.lat, cd.lng], {
                icon: L.divIcon({
                    className: "",
                    html: `<div class="water-drop">${dropCyan}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 28],
                }),
            });

            marker.bindPopup(`
                <div class="popup-card">
                    <span class="cd-tag tag-cd">CD FUTURO</span>
                    <div class="cd-name cd-futuro">💧 ${i + 1}. ${cd.nome}</div>
                    <div class="cd-addr">${cd.endereco}</div>
                </div>
            `, { maxWidth: 260 });

            marker.addTo(map);
        });

        // Plot PAs Futuro (Laranja)
        PAS_FUTURO.forEach((pa, i) => {
            const marker = L.marker([pa.lat, pa.lng], {
                icon: L.divIcon({
                    className: "",
                    html: `<div class="water-drop">${dropOrange}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 28],
                }),
            });

            marker.bindPopup(`
                <div class="popup-card">
                    <span class="cd-tag tag-pa">PA FUTURO</span>
                    <div class="cd-name pa-futuro">💧 ${i + 1}. ${pa.nome}</div>
                    <div class="cd-addr">${pa.endereco}</div>
                </div>
            `, { maxWidth: 260 });

            marker.addTo(map);
        });
    </script>
</body>
</html>
